<script>
const SHEET='1_oeHpdG5VQurroIPG7kzDmwwtfLkCuqLJsN79_zIDGo';
const CSV=`https://docs.google.com/spreadsheets/d/${SHEET}/gviz/tq?tqx=out:csv&sheet=%E5%8C%AF%E7%8E%87&range=A3:B22`;
const CC={TWD:'tw',USD:'us',HKD:'hk',GBP:'gb',JPY:'jp',AUD:'au',CAD:'ca',SGD:'sg',CHF:'ch',THB:'th',NZD:'nz',EUR:'eu',KRW:'kr',MYR:'my',IDR:'id',PHP:'ph',VND:'vn',CNY:'cn'};
const DEC={JPY:0,KRW:0,IDR:0,VND:0,BTC:8};
let rates={TWD:{name:'新台幣',r:1}},order=['TWD'],fresh=true,updated=0,picking=null,page=0;
const $=id=>document.getElementById(id);
function flagHTML(c){if(c==='BTC')return '₿';const k=CC[c];return k?`<img src="https://flagcdn.com/w80/${k}.png" style="width:100%;height:100%;object-fit:cover">`:c.slice(0,1)}
function setFlag(el,c){el.className=el.className.replace(/ ?btc/,'')+(c==='BTC'?' btc':'');el.innerHTML=flagHTML(c)}
function parse(csv){const out={TWD:{name:'新台幣',r:1}},ord=['TWD'];
 csv.trim().split('\n').forEach(l=>{const m=l.match(/^"(.*)","(.*)"/);if(!m)return;const n=m[1].trim(),code=n.slice(-3).toUpperCase(),r=parseFloat(m[2]);
  if(!/^[A-Z]{3}$/.test(code)||!(r>0)||out[code])return;out[code]={name:n.slice(0,-3),r};ord.push(code)});
 return [out,ord]}
function evalExpr(s){s=s.replace(/[+\-*/.]$/,'');if(!s)return 0;
 s=s.replace(/(\d+\.?\d*(?:e[+-]?\d+)?)%/g,'($1/100)');
 if(!/^[\d+\-*/.()e ]+$/.test(s))return NaN;try{const v=Function('return ('+s+')')();return isFinite(v)?v:NaN}catch(e){return NaN}}
function fmt(v,c){if(isNaN(v))return '錯誤';const d=DEC[c]??2;const a=Math.abs(v);let dd=d;if(c!=='BTC'&&a>0&&a<1)dd=Math.max(d,4);
 return v.toLocaleString('en-US',{maximumFractionDigits:dd,minimumFractionDigits:0})}
function show(s){return s.replace(/\*/g,'×').replace(/\//g,'÷').replace(/-/g,'−')}
function ago(m){return m<1?'剛剛':m<60?m+' 分鐘前':m<1440?Math.floor(m/60)+' 小時前':Math.floor(m/1440)+' 天前'}
// plain number string, no exponent, trimmed to sensible precision
function numStr(v){if(!isFinite(v))return '0';let s=String(+v.toPrecision(12));if(/e/.test(s))s=v.toFixed(12).replace(/\.?0+$/,'');return s}
class Conv{
 constructor(root,key,def){this.r=root;this.key=key;this.sel=JSON.parse(localStorage[key]||JSON.stringify(def));this.expr='1';
  root.querySelectorAll('.pad button').forEach(b=>b.addEventListener('click',()=>this.press(b.dataset.k)));
  root.querySelectorAll('.cur').forEach(c=>c.addEventListener('click',()=>openPicker(this,+c.dataset.i)));
  root.querySelector('.refresh').onclick=load;root.querySelector('.menu').onclick=openAbout}
 q(c){return this.r.querySelector(c)}
 value(){return evalExpr(this.expr)}
 result(){const ra=rates[this.sel[0]],rb=rates[this.sel[1]];return ra&&rb?this.value()*ra.r/rb.r:NaN}
 save(){localStorage[this.key]=JSON.stringify(this.sel)}
 render(){const [a,b]=this.sel;this.q('.c0').textContent=a;this.q('.c1').textContent=b;setFlag(this.q('.f0'),a);setFlag(this.q('.f1'),b);
  const v=this.value(),e=this.expr,hasOp=/[+\-*/%]/.test(e.slice(1));
  this.q('.a0').textContent=hasOp?fmt(v,a):(/^\d+(\.\d*)?$/.test(e)?(()=>{const[i,d]=e.split('.');return Number(i).toLocaleString('en-US')+(d!==undefined?'.'+d:'')})():show(e));
  this.q('.e0').textContent=hasOp?show(e):'';
  const ra=rates[a],rb=rates[b];this.q('.a1').textContent=ra&&rb?fmt(this.result(),b):'—';
  this.q('.info').textContent=ra&&rb?`1 ${a} = ${fmt(ra.r/rb.r,b==='BTC'?'BTC':'X')} ${b}`:'載入中…';
  this.r.querySelectorAll('.op').forEach(x=>x.classList.toggle('sel','+-*/'.includes(x.dataset.k)&&x.dataset.k===e.slice(-1)));
  this.fit();this.label()}
 fit(){this.r.querySelectorAll('.amt').forEach(e=>{e.style.fontSize='';const w=e.parentElement.clientWidth-4;if(!w)return;const base=parseFloat(getComputedStyle(e).fontSize);
  const m=document.createElement('span');m.style.cssText=`position:absolute;visibility:hidden;white-space:nowrap;font:${getComputedStyle(e).font}`;m.textContent=e.textContent;document.body.appendChild(m);const tw=m.getBoundingClientRect().width;m.remove();
  if(tw>w)e.style.fontSize=Math.max(14,Math.floor(base*w/tw))+'px'})}
 label(){const u=this.q('.upd');if(!updated){u.textContent='';return}const m=Math.floor((Date.now()-updated)/60000);u.className='upd'+(fresh?'':' err');u.textContent=(fresh?'':'離線・')+ago(m)}
 press(k){let expr=this.expr;const last=expr.slice(-1);
  if(k==='C')expr='0';
  else if(k==='B')expr=expr.length>1?expr.slice(0,-1):'0';
  else if(k==='S'){const v=this.result();this.sel=[this.sel[1],this.sel[0]];if(!isNaN(v))expr=String(+v.toFixed(DEC[this.sel[0]]??2));this.save()}
  else if(k==='='){const v=evalExpr(expr);expr=isNaN(v)?'0':numStr(v)}
  else if('+-*/'.includes(k)){if('+-*/'.includes(last))expr=expr.slice(0,-1)+k;else if(last!=='.')expr+=k}
  else if(k==='%'){if(/\d$/.test(expr))expr+='%'}
  else if(k==='.'){const seg=expr.split(/[+\-*/]/).pop();if(!seg.includes('.')&&!seg.includes('%'))expr+=(seg===''?'0.':'.')}
  else{if(last==='%')expr+='*';const seg=expr.split(/[+\-*/]/).pop();if(expr==='0')expr=k;else if(seg==='0')expr=expr.slice(0,-1)+k;else if(seg.replace('.','').length<12)expr+=k}
  this.expr=expr;this.render()}
}
const P=[new Conv($('P0'),'fxSel',['USD','TWD']),new Conv($('P1'),'fxSel2',['TWD','USD'])];
try{const st=JSON.parse(localStorage.fxP2||'null');if(st&&st.expr){P[1].expr=st.expr;P[1].visited=true}}catch(e){}
{const r=P[1].render.bind(P[1]);P[1].render=()=>{r();if(P[1].visited)localStorage.fxP2=JSON.stringify({expr:P[1].expr})}}
const APPV=document.querySelector('meta[name=app-version]').content;
async function checkVersion(){try{const t=await (await fetch('./?vc='+Date.now(),{cache:'no-store'})).text();const m=t.match(/name="app-version" content="([^"]+)"/);
 if(m&&m[1]!==APPV&&sessionStorage.fxReloaded!==m[1]){sessionStorage.fxReloaded=m[1];location.replace(location.pathname+'?v='+m[1])}}catch(e){}}
function renderAll(){P.forEach(p=>p.render())}
function carry(){const a=P[0],b=P[1],v=a.result();if(b.visited&&b.expr!=='0')return;b.visited=true;b.sel[0]=a.sel[1];
 if(b.sel[1]===b.sel[0])b.sel[1]=b.sel[0]==='TWD'?'USD':'TWD';
 if(!rates[b.sel[1]])b.sel[1]=b.sel[0]==='TWD'?'USD':'TWD';
 const d=DEC[a.sel[1]]??2,dd=(a.sel[1]!=='BTC'&&Math.abs(v)>0&&Math.abs(v)<1)?Math.max(d,4):d;b.expr=isNaN(v)?'0':numStr(+v.toFixed(dd));b.save();b.render()}
const track=$('track');
function go(n){if(n===1&&page!==1)carry();page=n;track.style.transition='';track.style.transform=`translateX(${-50*n}%)`;setTimeout(()=>P.forEach(p=>p.fit()),380)}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>go(+t.dataset.go)));
// swipe
let sx=0,sy=0,dx=0,drag=false,lock=null;
track.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;dx=0;drag=true;lock=null},{passive:true});
track.addEventListener('touchmove',e=>{if(!drag)return;const t=e.touches[0];dx=t.clientX-sx;const dy=t.clientY-sy;
 if(lock===null&&(Math.abs(dx)>8||Math.abs(dy)>8))lock=Math.abs(dx)>Math.abs(dy)?'x':'y';
 if(lock!=='x')return;e.preventDefault();let off=-page*innerWidth+dx;off=Math.min(0,Math.max(-innerWidth,off));
 track.style.transition='none';track.style.transform=`translateX(${off/2/innerWidth*100}%)`},{passive:false});
track.addEventListener('touchend',()=>{if(!drag)return;drag=false;if(lock!=='x'){return}
 const th=Math.min(80,innerWidth*.2);let n=page;if(dx<-th)n=1;else if(dx>th)n=0;go(n)});
function openPicker(conv,i){picking=[conv,i];$('list').innerHTML=order.map(c=>`<div class="item ${c===conv.sel[i]?'on':''}" data-c="${c}"><div class="flag${c==='BTC'?' btc':''}">${flagHTML(c)}</div><div class="n">${c}<small>${rates[c].name}</small></div></div>`).join('');
 $('list').querySelectorAll('.item').forEach(it=>it.onclick=()=>{const c=it.dataset.c,o=1-i;if(conv.sel[o]===c)conv.sel[o]=conv.sel[i];conv.sel[i]=c;conv.save();$('picker').classList.remove('show');conv.render()});
 $('picker').classList.add('show')}
function openAbout(){$('aboutBody').innerHTML=`<p>匯率來源：你的 Google 試算表「匯率」分頁（GOOGLEFINANCE，約每 20 分鐘更新）。</p><p>匯率為 1 單位外幣兌新台幣，其他貨幣之間以台幣交叉換算。</p><p>往左滑或點右側橘色把手可進入第二頁，把這頁的換算結果帶過去繼續算。</p><p>最後更新：${updated?new Date(updated).toLocaleString('zh-TW'):'—'}${fresh?'':'（離線，使用快取）'}</p><p><a href="https://docs.google.com/spreadsheets/d/${SHEET}/edit" target="_blank">開啟試算表</a></p>`;$('about').classList.add('show')}
async function load(){document.querySelectorAll('.rico').forEach(r=>r.classList.add('spin'));
 try{const r=await fetch(CSV+'&t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;const [o,ord]=parse(await r.text());if(ord.length<2)throw 0;
  rates=o;order=ord;updated=Date.now();fresh=true;localStorage.fxCache=JSON.stringify({rates,order,updated})}
 catch(e){fresh=false;const c=localStorage.fxCache;if(c){const j=JSON.parse(c);rates=j.rates;order=j.order;updated=j.updated}}
 document.querySelectorAll('.rico').forEach(r=>r.classList.remove('spin'));renderAll();
 if(!updated)document.querySelectorAll('.upd').forEach(u=>{u.className='upd err';u.textContent='無法取得匯率'})}
document.querySelectorAll('.sheet').forEach(s=>s.addEventListener('click',e=>{if(e.target===s)s.classList.remove('show')}));
document.addEventListener('visibilitychange',()=>{if(!document.hidden){load();checkVersion()}});
checkVersion();
setInterval(()=>P.forEach(p=>p.label()),30000);setInterval(load,10*60000);
addEventListener('resize',()=>P.forEach(p=>p.fit()));
const c0=localStorage.fxCache;if(c0){const j=JSON.parse(c0);rates=j.rates;order=j.order;updated=j.updated;fresh=false}
renderAll();load();
if(document.fonts)document.fonts.ready.then(()=>P.forEach(p=>p.fit()));
</script></body></html>
